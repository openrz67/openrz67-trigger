; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bare `pio run` / `pio run -t upload` builds and flashes only the production
; env. Use `pio run -e debug -t upload` for the USB-CDC logging build.
default_envs = openrz67-trigger

[env]
; pioarduino = Arduino core 3.x (ESP-IDF 5.5) with a NimBLE-backed BLE library.
; Espressif's own platform-espressif32 stopped at Arduino core 2.0.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 80 MHz CPU clock (board default 160), the DFS ceiling in configurePowerManagement().
board_build.f_cpu = 80000000L
; The prebuilt Arduino libraries have power management off, so pioarduino rebuilds
; them with these settings (first build per machine takes minutes). PM + tickless
; idle let esp_pm_configure() turn on DFS and automatic light sleep; BLE modem sleep
; keeps the connection through light sleep, timed by the 32.768 kHz crystal X2. If X2
; does not start, IDF logs it and falls back to the internal RC, and the controller
; to the main crystal, which keeps BLE working but stops light sleep.
; Inline, not file://: a file's mtime goes into the rebuild hash and would defeat the CI cache.
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_RTC_CLK_SRC_EXT_CRYS=y
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_EXT_32K_XTAL=y
; ARDUINO_USB_MODE=1 is the only mode the C3 has (0 is the OTG stack of the S2/S3).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D FW_VERSION='"0.4.0"'
check_tool = cppcheck
; Arduino entry points and BLE callbacks are called by the framework
check_flags = cppcheck: --suppress=unusedFunction

[env:openrz67-trigger]
; Production build: no serial output. UART0 would take GPIO20 (the LED) and
; GPIO21, and the ESP32-C3's USB Serial/JTAG port does not survive light sleep,
; so logging is compiled out here.
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D VERBOSE=0

[env:debug]
; Bench build: Serial over USB CDC on the USB-C connector.
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VERBOSE=1

[env:rev1]
extends = env:openrz67-trigger
; Rev 1 board (archive/2025-09-23-rev1): S1 is driven from GPIO21, not GPIO4.
build_flags =
    ${env:openrz67-trigger.build_flags}
    -D S1_PIN=21

[env:rev3]
extends = env:openrz67-trigger
; Rev 3 board (pcb/kicad source, not ordered yet): S2 is driven from GPIO6, and GPIO3
; reads the SW_SYS divider (R24/R25 1 MΩ + C32) as the battery voltage.
build_flags =
    ${env:openrz67-trigger.build_flags}
    -D S2_PIN=6
    -D VBAT_ADC_PIN=3

[env:rev3-debug]
extends = env:debug
build_flags =
    ${env:debug.build_flags}
    -D S2_PIN=6
    -D VBAT_ADC_PIN=3
