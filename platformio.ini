; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:openrz67-trigger]
platform = espressif32@6.6.0      ; stabil med Arduino 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Production build: no serial output, light sleep on. UART0 would take GPIO20
; (the LED) and GPIO21, and the ESP32-C3's USB Serial/JTAG port does not survive
; automatic light sleep (the host loses the device each time the chip dozes), so
; logging is compiled out here. ARDUINO_USB_MODE=1 is the only mode the C3 has
; (0 is the OTG stack of the S2/S3).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D VERBOSE=0

[env:debug]
extends = env:openrz67-trigger
; Bench build: Serial over USB CDC on the USB-C connector, light sleep off so the
; link stays up (configurePowerManagement in src/main.cpp keys off the CDC flag).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VERBOSE=1
