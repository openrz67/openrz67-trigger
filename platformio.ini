; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bare `pio run` / `pio run -t upload` builds and flashes only the production
; env. Use `pio run -e debug -t upload` for the USB-CDC logging build.
default_envs = openrz67-trigger

[env:openrz67-trigger]
platform = espressif32@6.6.0      ; pins framework-arduinoespressif32 3.20014 = Arduino core 2.0.14
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 80 MHz CPU clock (board default 160). esp_pm cannot apply its 80 MHz maximum in
; this framework build (see below), so the clock is set at build time instead.
board_build.f_cpu = 80000000L
; Production build: no serial output. UART0 would take GPIO20 (the LED) and
; GPIO21, and the ESP32-C3's USB Serial/JTAG port does not survive automatic light
; sleep (the host loses the device each time the chip dozes), so logging is compiled
; out here. Note: this framework build (espressif32 6.6.0 / Arduino core 2.0.14) has
; CONFIG_PM_ENABLE unset, so esp_pm_configure() is a no-op and light sleep is not
; actually active in either env; configurePowerManagement() logs that.
; ARDUINO_USB_MODE=1 is the only mode the C3 has (0 is the OTG stack of the S2/S3).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D VERBOSE=0

[env:debug]
extends = env:openrz67-trigger
; Bench build: Serial over USB CDC on the USB-C connector; light sleep requested off
; so the link would stay up if a PM-enabled framework is ever used
; (configurePowerManagement in src/main.cpp keys off the CDC flag).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VERBOSE=1

[env:rev1]
extends = env:openrz67-trigger
; Rev 1 board (archive/2025-09-23-rev1): S1 is driven from GPIO21, not GPIO4.
build_flags =
    ${env:openrz67-trigger.build_flags}
    -D S1_PIN=21
