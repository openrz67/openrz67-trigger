<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">OpenRZ67 PhotoMOS wiring diagram</title>
  <desc id="description">GPIO4 and GPIO3 drive two TLP172AM input LEDs through 150 ohm resistors. Their isolated outputs close the Mamiya RZ67 S1 and S2 signals to camera ground. The camera 6 volt pin is not connected, and camera ground stays isolated from ESP32 ground.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #52606d; }
      .tiny { font-size: 12px; fill: #68737d; }
      .board { fill: #e9f6f1; stroke: #17815f; stroke-width: 3; }
      .photo { fill: #fff7e8; stroke: #d88718; stroke-width: 3; }
      .camera { fill: #eef3ff; stroke: #456bd1; stroke-width: 3; }
      .channel { fill: #fff; stroke: #d9a34f; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text x="50" y="52" class="title">ESP32-C3 to Mamiya RZ67</text>
  <text x="50" y="80" class="small">Current rev 2 shutter interface with two isolated TLP172AM PhotoMOS channels</text>

  <text x="50" y="128" class="section">CONTROLLER</text>
  <rect x="50" y="145" width="280" height="505" rx="18" class="board"/>
  <text x="82" y="190" class="label">ESP32-C3</text>
  <text x="82" y="214" class="small">Custom PCB or development board</text>

  <circle cx="310" cy="280" r="6" fill="#c13c66"/>
  <text x="82" y="275" class="label">GPIO4</text>
  <text x="82" y="299" class="small">S1_DRV · U1 pin 9</text>

  <circle cx="310" cy="460" r="6" fill="#c13c66"/>
  <text x="82" y="455" class="label">GPIO3</text>
  <text x="82" y="479" class="small">S2_DRV · U1 pin 8</text>

  <circle cx="310" cy="590" r="6" fill="#27323a"/>
  <text x="82" y="585" class="label">GND</text>
  <text x="82" y="609" class="small">Controller side only</text>

  <text x="385" y="128" class="section">ISOLATED SHUTTER SWITCHES</text>
  <rect x="385" y="145" width="410" height="505" rx="18" class="photo"/>

  <rect x="410" y="190" width="360" height="180" rx="14" class="channel"/>
  <text x="430" y="220" class="label">U5 · TLP172AM · S1</text>
  <rect x="430" y="263" width="82" height="34" rx="7" fill="#fff7e8" stroke="#d88718" stroke-width="2"/>
  <text x="471" y="285" text-anchor="middle" class="small">R21 150 Ω</text>
  <line x1="316" y1="280" x2="430" y2="280" stroke="#c13c66" stroke-width="4" stroke-linecap="round"/>
  <line x1="512" y1="280" x2="535" y2="280" stroke="#c13c66" stroke-width="4" stroke-linecap="round"/>
  <rect x="535" y="258" width="58" height="44" rx="8" fill="#fff7e8" stroke="#d88718" stroke-width="2"/>
  <text x="564" y="285" text-anchor="middle" class="label">LED</text>
  <text x="535" y="321" class="tiny">A</text>
  <text x="585" y="321" class="tiny">K</text>
  <polyline points="593,280 606,280 606,590" fill="none" stroke="#27323a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="598" y1="268" x2="657" y2="268" stroke="#d88718" stroke-width="2.5"/>
  <polygon points="667,268 657,263 657,273" fill="#d88718"/>
  <line x1="598" y1="292" x2="657" y2="292" stroke="#d88718" stroke-width="2.5"/>
  <polygon points="667,292 657,287 657,297" fill="#d88718"/>
  <line x1="630" y1="235" x2="630" y2="325" stroke="#9b7a43" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="680" y="257" width="68" height="46" rx="8" fill="#eef3ff" stroke="#456bd1" stroke-width="2"/>
  <text x="714" y="276" text-anchor="middle" class="tiny">MOSFET</text>
  <text x="714" y="292" text-anchor="middle" class="tiny">output</text>
  <line x1="665" y1="280" x2="680" y2="280" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="748" y1="280" x2="867" y2="280" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <polyline points="665,280 650,280 650,590" fill="none" stroke="#337f9c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="350" class="tiny">PCB pads 1/2 = Toshiba 1/3 · pads 3/4 = 4/6</text>

  <rect x="410" y="390" width="360" height="180" rx="14" class="channel"/>
  <text x="430" y="420" class="label">U6 · TLP172AM · S2</text>
  <rect x="430" y="443" width="82" height="34" rx="7" fill="#fff7e8" stroke="#d88718" stroke-width="2"/>
  <text x="471" y="465" text-anchor="middle" class="small">R22 150 Ω</text>
  <line x1="316" y1="460" x2="430" y2="460" stroke="#c13c66" stroke-width="4" stroke-linecap="round"/>
  <line x1="512" y1="460" x2="535" y2="460" stroke="#c13c66" stroke-width="4" stroke-linecap="round"/>
  <rect x="535" y="438" width="58" height="44" rx="8" fill="#fff7e8" stroke="#d88718" stroke-width="2"/>
  <text x="564" y="465" text-anchor="middle" class="label">LED</text>
  <text x="535" y="501" class="tiny">A</text>
  <text x="585" y="501" class="tiny">K</text>
  <line x1="593" y1="460" x2="606" y2="460" stroke="#27323a" stroke-width="4" stroke-linecap="round"/>
  <line x1="598" y1="448" x2="657" y2="448" stroke="#d88718" stroke-width="2.5"/>
  <polygon points="667,448 657,443 657,453" fill="#d88718"/>
  <line x1="598" y1="472" x2="657" y2="472" stroke="#d88718" stroke-width="2.5"/>
  <polygon points="667,472 657,467 657,477" fill="#d88718"/>
  <line x1="630" y1="415" x2="630" y2="505" stroke="#9b7a43" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="680" y="437" width="68" height="46" rx="8" fill="#eef3ff" stroke="#456bd1" stroke-width="2"/>
  <text x="714" y="456" text-anchor="middle" class="tiny">MOSFET</text>
  <text x="714" y="472" text-anchor="middle" class="tiny">output</text>
  <line x1="665" y1="460" x2="680" y2="460" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="748" y1="460" x2="867" y2="460" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <line x1="665" y1="460" x2="650" y2="460" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <text x="430" y="550" class="tiny">PCB pads 1/2 = Toshiba 1/3 · pads 3/4 = 4/6</text>

  <line x1="606" y1="590" x2="310" y2="590" stroke="#27323a" stroke-width="4" stroke-linecap="round"/>
  <text x="600" y="613" text-anchor="end" class="tiny">ESP32 GND</text>

  <text x="850" y="128" class="section">CAMERA PORT</text>
  <rect x="850" y="145" width="300" height="505" rx="18" class="camera"/>
  <text x="882" y="190" class="label">Mamiya RZ67</text>
  <text x="882" y="214" class="small">Four-pin remote connector</text>

  <circle cx="885" cy="245" r="18" fill="#fff" stroke="#9ba5ad" stroke-width="3"/>
  <text x="885" y="251" text-anchor="middle" class="label">1</text>
  <text x="920" y="241" class="label">6 V</text>
  <text x="920" y="263" class="small">Do not connect</text>

  <circle cx="885" cy="280" r="18" fill="#fff" stroke="#337f9c" stroke-width="3"/>
  <text x="885" y="286" text-anchor="middle" class="label">3</text>
  <text x="920" y="286" class="label">S1</text>

  <circle cx="885" cy="460" r="18" fill="#fff" stroke="#337f9c" stroke-width="3"/>
  <text x="885" y="466" text-anchor="middle" class="label">4</text>
  <text x="920" y="466" class="label">S2</text>

  <circle cx="885" cy="590" r="18" fill="#fff" stroke="#27323a" stroke-width="3"/>
  <text x="885" y="596" text-anchor="middle" class="label">2</text>
  <text x="920" y="586" class="label">GND</text>
  <text x="920" y="608" class="small">Camera side · AGND</text>
  <line x1="650" y1="590" x2="867" y2="590" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>

  <rect x="50" y="685" width="1100" height="48" rx="12" fill="#f8fafb" stroke="#cbd5dc" stroke-width="2"/>
  <circle cx="78" cy="709" r="8" fill="#456bd1"/>
  <text x="98" y="714" class="small">GPIO HIGH turns the channel on. Camera GND is isolated from ESP32 GND.</text>
  <text x="1118" y="714" text-anchor="end" class="tiny">Current PCB: U5 = S1 · U6 = S2</text>
</svg>
