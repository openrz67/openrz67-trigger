name: firmware

on:
  push:
    paths: ['src/**', 'platformio.ini', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['src/**', 'platformio.ini', '.github/workflows/firmware.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e openrz67-trigger -e debug -e rev1 -e rev3 -e rev3-debug
      - run: pio check -e rev3-debug --skip-packages --fail-on-defect=high --fail-on-defect=medium
