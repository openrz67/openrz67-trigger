# Bluetooth: peripheral only, one connection, 0 dBm
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="OpenRZ67"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF="OpenRZ67"
CONFIG_BT_DIS_MODEL="Trigger"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="dev"
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_CTLR_TX_PWR_0=y

# GPIO, ADC (VDD measurement), power off
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_POWEROFF=y
CONFIG_PM=y

# No crystal on the module: 32 kHz from the calibrated RC oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# P0.09 / P0.10 drive the PhotoMOS LEDs, not NFC
CONFIG_NFCT_PINS_AS_GPIOS=y

# Nothing talks on a serial port: no UART, no console, no logging.
# debug.conf turns RTT logging on for a J-Link / debugprobe session.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
